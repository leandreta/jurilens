name: Benchmark semanal

on:
  schedule:
    - cron: "17 9 * * 1" # toda segunda, 06:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jurislens/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Rodar benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m jurislens bench -n 90 --llm-sample 30

      - name: Publicar resultados no README
        run: |
          git config user.name "jurislens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results site/data
          git diff --cached --quiet && exit 0
          git commit -m "bench: resultados de $(date -u +%Y-%m-%d) [skip ci]"
          git push
