name: Bot de extração (issues)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: jurislens-bot
  cancel-in-progress: false

jobs:
  extract:
    if: contains(github.event.issue.labels.*.name, 'jurislens') || startsWith(github.event.issue.title, '[JurisLens]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      # Proteção de custo: cada pessoa pode usar a IA 3x por dia, e o repo inteiro 40x por dia.
      # Acima disso o bot continua respondendo, mas só com regras (custo zero).
      - name: Limite de uso
        id: quota
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          mine=$(gh issue list -R "$GITHUB_REPOSITORY" --author "$AUTHOR" --state all \
                 --search "JurisLens in:title created:>$since" --json number --jq length)
          total=$(gh issue list -R "$GITHUB_REPOSITORY" --state all \
                 --search "JurisLens in:title created:>$since" --limit 200 --json number --jq length)
          echo "mine=$mine total=$total"
          if [ "$AUTHOR" = "$OWNER" ] || { [ "$mine" -le 3 ] && [ "$total" -le 40 ]; }; then
            echo "use_ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_ai=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Extrair
        env:
          ANTHROPIC_API_KEY: ${{ steps.quota.outputs.use_ai == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
        run: python -m jurislens.github_bot comment.md

      - name: Responder
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file comment.md
          gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" --reason completed
