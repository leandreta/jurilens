[project]
name = "jurislens"
version = "0.1.0"
description = "Extração de dados de processos judiciais com regras + validação + Claude, com benchmark contínuo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.0", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jurislens = "jurislens.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jurislens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
